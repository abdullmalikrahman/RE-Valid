# =============================================================================
# RE-Valid — Nginx Reverse Proxy + HTTPS (Let's Encrypt)
# Domain: revalid.my.id
# =============================================================================

# ─── Phase 1: HTTP ───────────────────────────────────────────────────────────
# Terima ACME challenge dari Certbot (untuk verifikasi domain Let's Encrypt)
# dan redirect semua traffic HTTP lain ke HTTPS.
server {
    listen 80;
    server_name revalid.my.id;

    # Certbot ACME challenge — jangan di-redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint (untuk Docker healthcheck, tidak di-redirect)
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Semua request HTTP lain → redirect permanen ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Phase 2: HTTPS ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name revalid.my.id;

    # ── Sertifikat SSL (diisi otomatis oleh Certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/revalid.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revalid.my.id/privkey.pem;

    # ── Konfigurasi SSL yang direkomendasikan (modern browsers) ───────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()"    always;

    # ── Ukuran body request (untuk upload file CSV / GeoTIFF) ─────────────────
    client_max_body_size 50M;

    # ── Resolver Docker internal — re-resolve hostname saat container diganti ─
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Proxy ke Next.js Frontend ─────────────────────────────────────────────
    # Next.js menangani semua routing, termasuk rewrite /api/v1/* → backend
    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;

        # Headers standar untuk reverse proxy
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (digunakan oleh Next.js HMR dan real-time features)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeout lebih panjang untuk halaman yang memuat data besar
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Health check endpoint (opsional, untuk monitoring) ────────────────────
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
